name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            name: macos-arm64
            package: macOS app
          - os: windows-latest
            name: windows-x64
            package: windows app
          - os: ubuntu-latest
            name: ubuntu-24.04-x64
            package: linux system --target ubuntu:24.04
          - os: ubuntu-latest
            name: fedora-x64
            package: linux system --target fedora:44
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v7
      - name: Check version
        run: test "v$(uv version --short)" = "$GITHUB_REF_NAME"
      - name: Build frontend
        run: npm ci --include=optional && npm run build
        working-directory: frontend
      - name: Build proxy_tools wheel
        run: uvx pip wheel --no-deps proxy_tools -w wheels
      - name: Build installer
        run: uvx --python 3.13 briefcase==0.4.7 package ${{ matrix.package }} --adhoc-sign --no-input
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" * --repo "$GITHUB_REPOSITORY" --generate-notes
