# Builds the app on each OS when a version tag (v*) is pushed and attaches it to a GitHub release.
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            name: macos-arm64
          - os: windows-latest
            name: windows-x64
          # The oldest available Ubuntu, so the build runs on older glibc versions too
          - os: ubuntu-22.04
            name: linux-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v6

      # The same script builds the app locally
      - name: Build app
        run: bash scripts/build_app.sh

      - name: Package
        run: |
          out="Microsandbox-Studio-${GITHUB_REF_NAME}-${{ matrix.name }}"
          cd dist
          case "${{ runner.os }}" in
            macOS) ditto -c -k --keepParent "Microsandbox Studio.app" "../$out.zip" ;;
            Windows) 7z a "../$out.zip" "Microsandbox Studio" ;;
            Linux) tar czf "../$out.tar.gz" "Microsandbox Studio" ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: Microsandbox-Studio-*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" Microsandbox-Studio-* --repo "$GITHUB_REPOSITORY" --generate-notes
